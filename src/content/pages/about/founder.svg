<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <!-- Premium minimalist modern organic placeholder background -->
  <rect width="400" height="500" rx="16" fill="#F0EBD5" stroke="#6D8C6E" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="10" y="10" width="380" height="480" rx="12" fill="#EBF3EB" opacity="0.3"/>
  
  <!-- Stylized avatar outline -->
  <g transform="translate(0, 40)" opacity="0.45">
    <!-- Head -->
    <circle cx="200" cy="180" r="60" fill="none" stroke="#22442B" stroke-width="3" stroke-dasharray="2, 4"/>
    <!-- Shoulders -->
    <path d="M100,360 C100,280 140,280 200,280 C260,280 300,280 300,360" fill="none" stroke="#22442B" stroke-width="3" stroke-dasharray="2, 4"/>
  </g>
  
  <!-- Text overlay -->
  <text x="200" y="430" font-family="system-ui, sans-serif" font-size="14" letter-spacing="0.1em" fill="#22442B" opacity="0.4" text-anchor="middle">
    PORTRAIT PLACEHOLDER
  </text>
</svg>
